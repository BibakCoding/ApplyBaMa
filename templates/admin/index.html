{% extends "admin/base_site.html" %}
{% load i18n log static %}

{% block extrastyle %}
{{ block.super }}
{# Dashboard styles live in a cacheable stylesheet — no inline <style> here. #}
<link rel="stylesheet" href="{% static 'css/admin/admin-dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="custom-admin-dashboard">
    <div class="dashboard-header">
        <h1 class="dashboard-title">{% trans "Welcome to Apply BM Control Center" %}</h1>
        <p class="dashboard-subtitle">{% trans "Manage your platform, content, and users from one centralized dashboard." %}</p>
    </div>

    <div class="dashboard-grid">

        <!-- 🏠 HOMEPAGE MANAGEMENT -->
        <div class="admin-card">
            <div class="card-header">
                <div class="card-icon">🏠</div>
                <h2 class="card-title">{% trans "Homepage Management" %}</h2>
            </div>
            <ul class="model-list">
                {% for app in app_list %}{% for model in app.models %}
                    {% if model.object_name == "SiteSettings" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "HowItWorksStep" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "DocumentRequirement" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "SuccessStory" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% endif %}
                {% endfor %}{% endfor %}
            </ul>
        </div>

        <!-- 🏛 UNIVERSITIES & PROGRAMS -->
        <div class="admin-card">
            <div class="card-header">
                <div class="card-icon">🏛</div>
                <h2 class="card-title">{% trans "Universities & Programs" %}</h2>
            </div>
            <ul class="model-list">
                {% for app in app_list %}{% for model in app.models %}
                    {% if model.object_name == "University" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "Program" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "Faculty" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "Country" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "City" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "TermOption" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "YearOption" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% endif %}
                {% endfor %}{% endfor %}
            </ul>
        </div>

        <!-- 👥 USERS & COMPANIES -->
        <div class="admin-card">
            <div class="card-header">
                <div class="card-icon">👥</div>
                <h2 class="card-title">{% trans "Users & Companies" %}</h2>
            </div>
            <ul class="model-list">
                {% for app in app_list %}{% for model in app.models %}
                    {% if model.object_name == "User" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "CompanyProfile" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "AgentProfile" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% elif model.object_name == "StudentProfile" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% endif %}
                {% endfor %}{% endfor %}
            </ul>
        </div>

        <!-- 📁 APPLICATIONS -->
        <div class="admin-card">
            <div class="card-header">
                <div class="card-icon">📁</div>
                <h2 class="card-title">{% trans "Applications" %}</h2>
            </div>
            <ul class="model-list">
                {% for app in app_list %}{% for model in app.models %}
                    {% if model.object_name == "Application" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% endif %}
                {% endfor %}{% endfor %}
            </ul>
        </div>

        <!-- 🔐 SECURITY -->
        <div class="admin-card">
            <div class="card-header">
                <div class="card-icon">🔐</div>
                <h2 class="card-title">{% trans "Security & Verification" %}</h2>
            </div>
            <ul class="model-list">
                {% for app in app_list %}{% for model in app.models %}
                    {% if model.object_name == "VerificationCode" %}<li class="model-item"><a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a><div class="model-actions">{% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}<a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a></div></li>
                    {% endif %}
                {% endfor %}{% endfor %}
            </ul>
        </div>

        <!-- ⚙️ SYSTEM & AUTOMATION -->
        <div class="admin-card">
            <div class="card-header">
                <div class="card-icon">⚙️</div>
                <h2 class="card-title">{% trans "System & Automation" %}</h2>
            </div>
            <ul class="model-list">
                {% for app in app_list %}{% for model in app.models %}
                    {% if model.object_name == "SiteSettings" %}
                    {% elif model.object_name == "HowItWorksStep" %}
                    {% elif model.object_name == "DocumentRequirement" %}
                    {% elif model.object_name == "SuccessStory" %}
                    {% elif model.object_name == "University" %}
                    {% elif model.object_name == "Program" %}
                    {% elif model.object_name == "Faculty" %}
                    {% elif model.object_name == "Country" %}
                    {% elif model.object_name == "City" %}
                    {% elif model.object_name == "TermOption" %}
                    {% elif model.object_name == "YearOption" %}
                    {% elif model.object_name == "User" %}
                    {% elif model.object_name == "CompanyProfile" %}
                    {% elif model.object_name == "AgentProfile" %}
                    {% elif model.object_name == "StudentProfile" %}
                    {% elif model.object_name == "Application" %}
                    {% elif model.object_name == "VerificationCode" %}
                    {% else %}
                        <li class="model-item">
                            <a href="{{ model.admin_url }}" class="model-name">{{ model.name }}</a>
                            <div class="model-actions">
                                {% if model.add_url %}<a href="{{ model.add_url }}" class="action-link action-add">{% trans 'Add' %}</a>{% endif %}
                                <a href="{{ model.admin_url }}" class="action-link action-change">{% trans 'Change' %}</a>
                            </div>
                        </li>
                    {% endif %}
                {% endfor %}{% endfor %}
            </ul>
        </div>

        <!-- 🕒 RECENT ACTIONS (Full Width Bottom Card) -->
        {% get_admin_log 10 as admin_log for_user user %}
        {% if admin_log %}
        <div class="recent-actions-card">
            <div class="card-header card-header--flush">
                <div class="card-icon">🕒</div>
                <h2 class="card-title">{% trans 'Recent Actions' %}</h2>
            </div>
            <ul class="actionlog-list">
                {% for entry in admin_log %}
                <li class="actionlog-item">
                    {% if entry.is_addition %}
                        <span class="action-badge badge-add">{% trans 'Added' %}</span>
                    {% elif entry.is_change %}
                        <span class="action-badge badge-change">{% trans 'Changed' %}</span>
                    {% elif entry.is_deletion %}
                        <span class="action-badge badge-delete">{% trans 'Deleted' %}</span>
                    {% endif %}

                    {% if entry.is_deletion or not entry.get_admin_url %}
                        <span class="model-name model-name--muted">{{ entry.object_repr }}</span>
                    {% else %}
                        <a href="{{ entry.get_admin_url }}" class="actionlog-link">{{ entry.object_repr }}</a>
                    {% endif %}

                    <span class="actionlog-meta">
                        {% if entry.content_type %}
                            {{ entry.content_type.name|capfirst }}
                        {% else %}
                            {% trans 'Unknown' %}
                        {% endif %}
                    </span>
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

    </div>
</div>
{% endblock %}

{% block sidebar %}
    {# We hide the default sidebar because we moved Recent Actions into the main grid #}
{% endblock %}
