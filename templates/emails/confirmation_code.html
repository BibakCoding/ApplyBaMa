<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ site_name }} - Confirmation Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            color: #51545e;
            padding: 20px;
        }
        .email-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
        }
        .code {
            font-size: 24px;
            font-weight: bold;
            color: #3869d4;
            letter-spacing: 4px;
            margin: 20px 0;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #6b6e76;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <h2>{{ site_name }}</h2>
        <p>Dear user,</p>
        <p>Use the following confirmation code to proceed:</p>
        <div class="code">{{ code }}</div>
        <p>If you did not request this, please ignore this email.</p>
        <p>Thank you,<br>{{ site_name }} Team</p>
    </div>
    <div class="footer">
        &copy; {{ site_name }}. All rights reserved.
    </div>
</body>
</html>
