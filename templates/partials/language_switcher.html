{# templates/partials/language_switcher.html #}
{% load i18n static custom_filters %}
{% get_current_language as CURRENT_LANGUAGE %}
{% get_available_languages as LANGUAGES %}
<div class="flex justify-center">
  <div class="language-switcher flex space-x-2" role="group" aria-label="{% trans 'Choose language' %}">
    {% for lang_code, lang_name in LANGUAGES %}
      {% if lang_code == CURRENT_LANGUAGE %}
        <a href="{{ request.path|translate_path:lang_code }}" title="{{ lang_name }}"
           aria-current="true"
           class="p-1 rounded bg-gray-200">
      {% else %}
        <a href="{{ request.path|translate_path:lang_code }}" title="{{ lang_name }}"
           class="p-1 rounded">
      {% endif %}
      <img src="{% static 'images/flag-'|add:lang_code|add:'.png' %}" alt="{{ lang_name }}" class="w-6 h-4">
    </a>
    {% endfor %}
  </div>
</div>
