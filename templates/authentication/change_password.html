{% extends 'base.html' %}
{% load i18n static custom_filters %}

{% block title %}{% trans "Change Password" %}{% endblock %}

{% block content %}
    <section
            class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-500 to-purple-600 text-white">
        <div class="p-8 rounded-lg shadow-lg w-full max-w-md text-gray-800 md:bg-white bg-transparent">
            <div class="text-center mb-8">
                <a href="{% url 'main' %}">
                    <img src="{% static 'images/logo.png' %}" alt="ApplyBaMa Logo" class="mx-auto h-12 w-12">
                </a>
                <h2 class="text-2xl font-bold mt-4 md:text-gray-800 text-white">
                    {% trans "Set New Password" %}
                </h2>
            </div>

            <form id="changeForm" method="post" novalidate>
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_code" class="block mb-2 md:text-gray-800 text-white">
                        {% trans "Verification Code" %}
                    </label>
                    <input type="text" name="code" id="id_code" class="w-full p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-300
                 bg-white/20 md:bg-white border border-white/50 md:border-gray-300
                 placeholder-white/70 md:placeholder-gray-500 text-white md:text-gray-800"
                           placeholder="{% trans 'Enter code' %}" required>
                    <p id="codeError" class="mt-1 text-sm text-red-500 hidden"></p>
                </div>

                <div class="mb-4">
                    <label for="id_new_password1" class="block mb-2 md:text-gray-800 text-white">
                        {% trans "New Password" %}
                    </label>
                    <input type="password" name="new_password1" id="id_new_password1" class="w-full p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-300
                 bg-white/20 md:bg-white border border-white/50 md:border-gray-300
                 placeholder-white/70 md:placeholder-gray-500 text-white md:text-gray-800" placeholder="********"
                           required>
                    <p id="pw1Error" class="mt-1 text-sm text-red-500 hidden"></p>
                </div>

                <div class="mb-6">
                    <label for="id_new_password2" class="block mb-2 md:text-gray-800 text-white">
                        {% trans "Confirm New Password" %}
                    </label>
                    <input type="password" name="new_password2" id="id_new_password2" class="w-full p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-300
                 bg-white/20 md:bg-white border border-white/50 md:border-gray-300
                 placeholder-white/70 md:placeholder-gray-500 text-white md:text-gray-800" placeholder="********"
                           required>
                    <p id="pw2Error" class="mt-1 text-sm text-red-500 hidden"></p>
                </div>

                <button type="submit" class="w-full p-2 rounded focus:outline-none focus:ring-2 focus:ring-offset-2
               bg-white/25 hover:bg-white/30 md:bg-blue-500 md:text-white
               text-white font-semibold md:hover:bg-blue-600 transition-all">
                    {% trans "Change Password" %}
                </button>
            </form>

            {% include 'partials/language_switcher.html' %}
        </div>
    </section>
{% endblock %}

{% block js %}
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('changeForm');
            const notyf = new Notyf({duration: 5000, dismissible: true, position: {x: 'right', y: 'top'}});
            const fields = ['code', 'pw1', 'pw2'];

            form.addEventListener('submit', async e => {
                e.preventDefault();
                // clear errors
                fields.forEach(f => {
                    const errP = document.getElementById(f + 'Error');
                    errP.textContent = '';
                    errP.classList.add('hidden');
                });

                const payload = new FormData(form);

                try {
                    const res = await fetch(form.action || window.location.href, {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': window.CSRF_TOKEN,
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        body: payload
                    });
                    const data = await res.json();

                    if (res.ok && data.success) {
                        notyf.success(data.message);
                        setTimeout(() => window.location.href = data.redirect, 800);
                    } else {
                        // field errors
                        Object.entries(data.errors || {}).forEach(([field, errs]) => {
                            if (field !== '__all__') {
                                const el = document.getElementById(field + 'Error');
                                el.textContent = errs[0].message;
                                el.classList.remove('hidden');
                            }
                        });
                        // non-field
                        if (data.errors && data.errors.__all__) {
                            data.errors.__all__.forEach(err => notyf.error(err.message));
                        }
                    }
                } catch (err) {
                    notyf.error('{{ _("An unexpected error occurred.") }}');
                    console.error(err);
                }
            });
        });
    </script>
{% endblock %}
