name: Django CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      DJANGO_SETTINGS_MODULE: ApplyBaMa.settings.dev
      SECRET_KEY: ci-only-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Run Django system checks
        run: python manage.py check

      # The migrations are committed, so this must fail rather than regenerate:
      # running plain `makemigrations` here silently built a schema nobody else
      # had, which is how a model change could ship without its migration.
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations from scratch
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2
