name: Django CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Test against modern, supported Python versions
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # PostgreSQL service for Django tests (required if your models use DB)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (for Pillow, etc.)
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev python3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # ✅ Use dev.txt which includes base.txt
        pip install -r requirements/dev.txt

    - name: Set environment variables for testing
      run: |
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "DATABASE_URL=postgres://test:test@localhost:5432/test_db" >> $GITHUB_ENV
        echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci-only" >> $GITHUB_ENV

    - name: Run migrations (verify DB setup)
      run: |
        python manage.py migrate --settings=ApplyBaMa.settings.dev

    - name: Run Django tests
      run: |
        python manage.py test --settings=ApplyBaMa.settings.dev --verbosity=2
