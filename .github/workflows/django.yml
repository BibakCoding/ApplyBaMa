# .github/workflows/django.yml
name: Django CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (for Pillow, mysqlclient, etc.)
      run: |
        sudo apt-get update
        sudo apt-get install -y libmysqlclient-dev python3-dev pkg-config

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # ✅ Use dev.txt which includes base.txt + testing tools
        pip install -r requirements/dev.txt

    - name: Set environment variables for testing
      run: |
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci-only-do-not-use-in-prod" >> $GITHUB_ENV
        # SQLite doesn't need DATABASE_URL, but if you use django-environ:
        echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
        echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV  # if used in dev.txt

    - name: Run migrations (verify DB setup)
      run: |
        python manage.py migrate --settings=ApplyBaMa.settings.dev

    - name: Run Django tests
      run: |
        python manage.py test --settings=ApplyBaMa.settings.dev --verbosity=2
